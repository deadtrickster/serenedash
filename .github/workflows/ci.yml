name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor (backslashes in f-strings). Ubuntu 24.04 ships it, which is the
        # deployment this is most likely to land on. 3.14 is what this is written on, and a version
        # nobody tests is a version that breaks quietly - it was missing from here for a while.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[mcp,dev]"
      - run: ruff check src tests
      - run: pytest

  # The tests above are hermetic on purpose: no server, no container, no perf. This job proves the
  # two entry points actually start, which no unit test can - a package that imports cleanly and
  # dies on argv is the failure mode worth catching here.
  entrypoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[mcp]"
      - name: serenedash --print-config resolves without a server
        run: |
          serenedash --print-config
          serenedash --help > /dev/null
      # No server, no credentials, no /proc for it: the frame has to render anyway and say why the
      # SQL panels are empty. It used to collapse to a single "cannot reach" line.
      - name: a frame renders with nothing to connect to
        run: |
          serenedash --once --no-color | tee /tmp/frame.txt
          grep -q "no credentials" /tmp/frame.txt
          serenedash --once --format json | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['sql']['available'] is False, d['sql']
          assert 'threads' in d and 'host' in d, sorted(d)
          print('json ok:', sorted(d))"
      # instructions.md is package data, not code: an editable install finds it in the source
      # tree whatever the build config says, so only a real wheel proves it ships. Losing it
      # degrades silently to a one-line fallback.
      - name: a built wheel carries the MCP instructions
        run: |
          pip wheel --no-deps -q -w /tmp/whl .
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("/tmp/whl/serenedash-*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          want = "serenedash/instructions.md"
          print(want, "present" if want in names else "MISSING")
          sys.exit(0 if want in names else 1)
          PY
      - name: the MCP server completes a handshake and lists its tools
        run: |
          python - <<'PY'
          import asyncio, sys
          from mcp import ClientSession, StdioServerParameters, stdio_client

          async def main():
              params = StdioServerParameters(command="serenedash-mcp")
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w) as s:
                      init = await s.initialize()
                      tools = sorted(t.name for t in (await s.list_tools()).tools)
                      print("tools:", ", ".join(tools))
                      missing = {"status", "storage", "memory", "activity", "threads",
                                 "profile", "host", "config", "query", "anomalies"} - set(tools)
                      if missing:
                          sys.exit(f"missing tools: {sorted(missing)}")
                      # The instructions are the context an agent reasons from, and the
                      # revision is how it tells that context from the running server.
                      text = init.instructions or ""
                      if len(text) < 5000 or "{{" in text:
                          sys.exit(f"instructions look wrong: {len(text)} chars")
                      res = [str(r.uri) for r in (await s.list_resources()).resources]
                      if "serenedash://instructions" not in res:
                          sys.exit(f"no instructions resource to re-read: {res}")
                      print("instructions:", len(text), "chars, resources:", res)
          asyncio.run(main())
          PY

  # The served page, in a real browser. Everything else in this file is Python asserting on Python,
  # and the last several bugs were in the half that only exists in a browser: an EventSource that
  # reconnected to a server which had forgotten what the tab was showing, a key bar that is only
  # navigation if it can be clicked, a filter box whose keystrokes must not reach the view
  # shortcuts. No SereneDB here - the dashboard runs against canned frames (tests/browser/harness.py)
  # so the job is hermetic and the browser is the only moving part.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[browser]"
      # Chromium only. Firefox and WebKit would triple the download to test a page whose whole
      # surface is an <svg>, an EventSource and one <input>.
      - run: playwright install --with-deps chromium
      - name: browser tests
        run: |
          pytest -m browser -v \
            --screenshot=only-on-failure --video=retain-on-failure \
            --tracing=retain-on-failure --output=browser-results
      # A failing browser test is close to unreadable from a log line. The trace opens in
      # playwright.dev/trace with the DOM at every step.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results
          path: browser-results/
          retention-days: 7

  # Against a real serened. The hermetic suite proves the rendering rules; this proves the
  # statements parse against the server's dialect and the panels hold on live data - which is the
  # half that has actually been wrong.
  integration:
    runs-on: ubuntu-latest
    services:
      serenedb:
        image: serenedb/serenedb:26.07.4
        env:
          POSTGRES_PASSWORD: ci-password
        ports:
          - 7890:7890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[mcp,dev]"

      - name: wait for the server to accept connections
        env:
          PGPASSWORD: ci-password
        run: |
          for i in $(seq 1 60); do
            if serenedash --print-config > /dev/null 2>&1 && python -c "
          import sys
          from serenedash.config import load_config
          from serenedash.db import sql_status
          sys.exit(1 if sql_status(load_config()[0]) else 0)"; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never came up"; docker ps -a; exit 1

      - name: integration tests
        env:
          PGPASSWORD: ci-password
          SERENEDASH_IT: "1"
          # The service container is reachable on localhost; there is no container to exec into
          # from the runner, so the filesystem and /proc panels degrade rather than fail.
          SERENEDB_TARGET: remote
          SERENEDB_HOST: 127.0.0.1
        run: pytest -v

      - name: a real frame renders end to end
        env:
          PGPASSWORD: ci-password
          SERENEDB_TARGET: remote
        run: serenedash --once

      - name: the json snapshot is the same collector, against the same server
        env:
          PGPASSWORD: ci-password
          SERENEDB_TARGET: remote
        run: |
          serenedash --once --format json | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['sql']['available'] is True, d['sql']
          for k in ('storage', 'memory', 'activity', 'threads', 'host', 'findings'):
              assert k in d, (k, sorted(d))
          print('snapshot ok:', len(json.dumps(d)), 'chars')"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A pinned shellcheck rather than the distro one. The runner's build raised an SC2015 that
      # 0.11 does not, so a clean local run said nothing about CI - which is the one thing a lint
      # job has to be good for. Pinned here and installed via mise locally, both at 0.11.0.
      - name: perf-snap.sh is shipped and run under sudo, so it gets linted like it matters
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          shellcheck --version
          shellcheck perf-snap.sh install.sh
          bash -n perf-snap.sh install.sh
      # Formatting too, and for the same reason it is linted: these are installed and run under
      # sudo. -d is diff mode, so an unformatted script fails the job and prints what it wanted.
      - name: and formatted, so a diff is a change rather than a reflow
        run: |
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          shfmt --version
          shfmt -d perf-snap.sh install.sh
